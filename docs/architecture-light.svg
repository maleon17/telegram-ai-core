  <text x="470" y="388.5" fill="#4b5563" font-size="12.5" text-anchor="middle">bridge token</text>
  <rect x="607.0" y="307" width="82.1" height="22" rx="11" fill="#ffffff"/>
  <text x="648" y="322.5" fill="#4b5563" font-size="12.5" text-anchor="middle">tool call</text>
  <rect x="350" y="24" width="260" height="76" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="480.0" y="48.0" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">Your userbot</text>
  <text x="480.0" y="67.0" fill="#6b7280" font-size="13.5" text-anchor="middle">claude_ask.py · codex_ask.py</text>
  <text x="480.0" y="86.0" fill="#6b7280" font-size="13.5" text-anchor="middle">built from one template</text>
  <rect x="350" y="184" width="260" height="88" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="480.0" y="214.0" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">cmd_queue.py · relay</text>
  <text x="480.0" y="233.0" fill="#6b7280" font-size="13.5" text-anchor="middle">a token per instance</text>
  <text x="480.0" y="252.0" fill="#6b7280" font-size="13.5" text-anchor="middle">owners decided here, not by a model</text>
  <rect x="690" y="176" width="220" height="56" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="800.0" y="209.0" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">ClaudeAsk worker</text>
  <rect x="690" y="248" width="220" height="56" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="800.0" y="281.0" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">CodexAsk worker</text>
  <rect x="690" y="352" width="220" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="800.0" y="379.5" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">telegram_actions_mcp.py</text>
