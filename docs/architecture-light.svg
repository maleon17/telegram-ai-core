  <rect x="40" y="330" width="210" height="66" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="145.0" y="358.5" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">Claude / Codex bridges</text>
  <text x="145.0" y="377.5" fill="#6b7280" font-size="13.5" text-anchor="middle">owner-only bridge token</text>
  <rect x="350" y="452" width="260" height="56" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="480.0" y="475.5" fill="#1f2937" font-size="15" font-weight="600" text-anchor="middle">registry.json</text>
  <text x="480.0" y="494.5" fill="#6b7280" font-size="13.5" text-anchor="middle">which parts live where</text>
  <text x="480" y="534" fill="#6b7280" font-size="12.5" font-style="italic" text-anchor="middle">written by every setup.sh, read by every part</text>
