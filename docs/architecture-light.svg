  <path d="M480,102 L480,182" fill="none" stroke="#374151" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M612,212 C650,212 650,204 688,204" fill="none" stroke="#374151" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M612,246 C650,246 650,276 688,276" fill="none" stroke="#374151" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
